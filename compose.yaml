services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  dagster:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      DAGSTER_HOME: /app/.dagster
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dagster_data:/app/.dagster
    command: ["dagster", "dev", "-f", "pipeline.py", "-h", "0.0.0.0"]
volumes:
  postgres_data:
  dagster_data:
